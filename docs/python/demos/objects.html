<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一切皆对象 · 内存空间的直觉 | Python V2</title>
<link rel="stylesheet" href="../../stylesheets/pyv2.css">
<script src="../../javascripts/vendor/three.min.js"></script>
<script src="../../javascripts/vendor/gsap.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #eef2f8; color: var(--pyv2-text);
}
.top { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; justify-content: space-between; align-items: center;
  padding: 12px 22px; background: linear-gradient(180deg, rgba(238,242,248,.95), rgba(238,242,248,0)); }
.top h1 { font-size: 16px; }
.top h1 .grad { background: var(--pyv2-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.top .crumb { font-size: 13px; }
.top .crumb a { color: var(--pyv2-sky); text-decoration: none; }

#stage { position: fixed; inset: 0; }
#hint3d { position: fixed; right: 16px; bottom: 14px; font-size: 12px; color: var(--pyv2-muted-2); z-index: 15;
  background: rgba(255,255,255,.88); padding: 5px 12px; border-radius: 999px; border: 1px solid var(--pyv2-border); }

.codebox {
  position: fixed; left: 22px; top: 66px; z-index: 15; width: 348px;
  background: rgba(255,255,255,.97); backdrop-filter: blur(10px);
  border: 1px solid var(--pyv2-border-2); border-radius: 14px; overflow: hidden;
  box-shadow: 0 18px 48px rgba(15,23,42,.14);
}
.codebox .bar { display: flex; gap: 6px; align-items: center; padding: 9px 13px; border-bottom: 1px solid var(--pyv2-border); }
.codebox .bar .dot { width: 10px; height: 10px; border-radius: 50%; }
.codebox .bar .dot.r { background: #ff5f57; } .codebox .bar .dot.y { background: #febc2e; } .codebox .bar .dot.g { background: #28c840; }
.codebox .bar span { margin-left: 6px; font-size: 11.5px; color: var(--pyv2-muted-2); font-family: var(--pyv2-font-mono); }
.codebox pre { font-family: var(--pyv2-font-mono); font-size: 13.5px; line-height: 2.05; padding: 12px 14px; }
.codebox .ln { display: block; padding: 0 10px; border-radius: 6px; color: #475569; transition: all .25s; white-space: pre; }
.codebox .ln .cm { color: #94a3b8; }
.codebox .ln.cur { background: rgba(2,132,199,.1); color: #0c4a6e; box-shadow: inset 2px 0 0 var(--pyv2-sky); }
.codebox .ln.done { color: #94a3b8; }

.note { padding: 11px 15px; border-top: 1px solid var(--pyv2-border); font-size: 12.8px; line-height: 1.65; color: var(--pyv2-muted); min-height: 66px; }
.note b { color: var(--pyv2-sky); }

.ctrls { display: flex; gap: 8px; padding: 10px 13px 13px; }
.ctrls button {
  flex: 1; font-size: 13px; font-weight: 600; padding: 8px 10px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--pyv2-border-2); background: var(--pyv2-surface-2); color: var(--pyv2-text);
}
.ctrls button:hover { border-color: var(--pyv2-sky); color: var(--pyv2-sky); }
.ctrls button.primary { background: var(--pyv2-grad); color: #071018; border-color: transparent; }

.inspector {
  position: fixed; right: 22px; top: 66px; z-index: 15; width: 300px;
  background: rgba(255,255,255,.97); backdrop-filter: blur(10px);
  border: 1px solid var(--pyv2-border-2); border-radius: 14px; padding: 15px 17px;
  font-family: var(--pyv2-font-mono); font-size: 12.5px; display: none;
  box-shadow: 0 18px 48px rgba(15,23,42,.14);
}
.inspector h3 { font-size: 13px; margin-bottom: 9px; color: #0f172a; }
.inspector .row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed rgba(15,23,42,.1); }
.inspector .row span:first-child { color: var(--pyv2-muted-2); }
.inspector .row span:last-child { color: #075985; text-align: right; }
.inspector .close { position: absolute; top: 9px; right: 12px; background: none; border: 0; color: var(--pyv2-muted); cursor: pointer; font-size: 14px; }
@media (max-width: 760px) { .codebox { width: calc(100vw - 44px); } .inspector { display: none !important; } }
</style>
</head>
<body>
<div class="top">
  <h1><span class="grad">交互演示</span> · 一切皆对象</h1>
  <div class="crumb"><a href="../../">← Python 程序设计 V2</a></div>
</div>
<div id="stage"></div>
<div id="hint3d">🖱 拖拽旋转 · 滚轮缩放 · 点击对象查看身份卡</div>

<div class="codebox">
  <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span>objects_demo.py</span></div>
  <pre id="code"></pre>
  <div class="note" id="note">点击 <b>「下一步」</b>逐行执行这段代码，到 3D 内存空间里看对象如何诞生、名字如何绑定。</div>
  <div class="ctrls">
    <button id="bPrev">← 上一步</button>
    <button id="bNext" class="primary">下一步 →</button>
    <button id="bReset">↺</button>
  </div>
</div>

<div class="inspector" id="inspector">
  <button class="close" id="insClose">✕</button>
  <h3>🔍 对象身份卡</h3>
  <div id="insBody"></div>
</div>

<script>
(function () {
  /* ================= 代码与步骤脚本 ================= */
  var CODE = [
    'a = "hello"',
    'b = a',
    'c = [1, 2]',
    'c.append(a)',
    'd = 3.14',
    'a == b, a is b',
    'e = "hello"',
    'a == e, a is e'
  ];
  var NOTES = [
    "赋值语句永远做两件事：<b>创建对象</b>（右侧）→ <b>绑定名字</b>（左侧）。绿色多面体就是那个 str 对象，漂浮在堆内存里。",
    "b = a <b>不创建新对象</b>——只是在命名空间里多了一个名字，指向同一个绿色对象。两个名字、一个对象。",
    "列表也是对象（紫色八面体），它的元素是<b>引用</b>：两个小蓝球是 int 对象 1 和 2，被列表握在手里。",
    "append 让列表长出一个新槽位，握住的正是 a 指向的那个字符串——<b>对象被共享了</b>，改列表会影响不到字符串（str 不可变）。",
    "浮点数对象（黄色）同样住在堆里。到现在为止：5 个对象、6 个名字。",
    "<b>==</b> 比较对象的值 → True；<b>is</b> 比较身份（是不是同一个对象）→ True。因为 a、b 本来就指向同一个对象。",
    "字符串驻留（intern）小知识：相同字面量可能复用同一个对象——看动画里 e 是否连到了老对象。",
    "值相等但身份不同时 == True、is False。结论：<b>判断 None 用 is，比较内容用 ==</b>。"
  ];

  /* ================= Three.js 场景 ================= */
  var stageEl = document.getElementById("stage");
  var scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0xe8eef6, 0.028);
  var camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  stageEl.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.95));
  var key = new THREE.DirectionalLight(0xffffff, 1.5); key.position.set(6, 10, 8); scene.add(key);
  var rim = new THREE.PointLight(0x7c3aed, 1.1, 60); rim.position.set(-8, -4, -10); scene.add(rim);

  var grid = new THREE.GridHelper(60, 40, 0xb6c4d6, 0xdde5ef);
  grid.position.y = -4.2; scene.add(grid);

  // 星尘背景
  (function () {
    var g = new THREE.BufferGeometry();
    var pos = [];
    for (var i = 0; i < 320; i++) {
      pos.push((Math.random() - 0.5) * 90, (Math.random() - 0.5) * 50, (Math.random() - 0.5) * 90);
    }
    g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xa8bcd6, size: 0.14, transparent: true, opacity: 0.55 })));
  })();

  /* ---------- 文字/光晕贴图 ---------- */
  function textSprite(text, color, size) {
    var c = document.createElement("canvas");
    var s = 4; c.width = 256 * s / 2; c.height = 64;
    var ctx = c.getContext("2d");
    ctx.font = "700 " + 34 + "px 'JetBrains Mono', Consolas, monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.shadowColor = color; ctx.shadowBlur = 14;
    ctx.fillStyle = color;
    ctx.fillText(text, c.width / 2, c.height / 2 + 1);
    var tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
    sp.scale.set(size || 4, (size || 4) * 0.25, 1);
    return sp;
  }
  function glowSprite(color, size) {
    var c = document.createElement("canvas"); c.width = c.height = 128;
    var ctx = c.getContext("2d");
    var g = ctx.createRadialGradient(64, 64, 4, 64, 64, 62);
    g.addColorStop(0, color + "cc"); g.addColorStop(0.35, color + "55"); g.addColorStop(1, "transparent");
    ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 128);
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false, blending: THREE.NormalBlending
    }));
    sp.scale.set(size, size, 1);
    return sp;
  }

  /* ---------- 自制轨道控制 ---------- */
  var orbit = { theta: 0.55, phi: 1.12, r: 22, tTheta: 0.55, tPhi: 1.12, tR: 22 };
  var dragging = false, px = 0, py = 0;
  renderer.domElement.addEventListener("pointerdown", function (e) { dragging = true; px = e.clientX; py = e.clientY; });
  window.addEventListener("pointerup", function () { dragging = false; });
  window.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    orbit.tTheta -= (e.clientX - px) * 0.006;
    orbit.tPhi = Math.max(0.25, Math.min(2.6, orbit.tPhi - (e.clientY - py) * 0.005));
    px = e.clientX; py = e.clientY;
  });
  renderer.domElement.addEventListener("wheel", function (e) {
    e.preventDefault();
    orbit.tR = Math.max(9, Math.min(46, orbit.tR + e.deltaY * 0.02));
  }, { passive: false });
  function updateCam() {
    orbit.theta += (orbit.tTheta - orbit.theta) * 0.08;
    orbit.phi += (orbit.tPhi - orbit.phi) * 0.08;
    orbit.r += (orbit.tR - orbit.r) * 0.1;
    camera.position.set(
      orbit.r * Math.sin(orbit.phi) * Math.sin(orbit.theta),
      orbit.r * Math.cos(orbit.phi) + 1.5,
      orbit.r * Math.sin(orbit.phi) * Math.cos(orbit.theta)
    );
    camera.lookAt(1.2, 0.6, 0);
  }

  /* ---------- 对象 / 名字 / 引用 ---------- */
  var TYPE_META = {
    str:   { color: "#34d399", geo: function () { return new THREE.IcosahedronGeometry(1.05, 0); } },
    int:   { color: "#38bdf8", geo: function () { return new THREE.OctahedronGeometry(0.7, 0); } },
    float: { color: "#fbbf24", geo: function () { return new THREE.DodecahedronGeometry(0.78, 0); } },
    list:  { color: "#a78bfa", geo: function () { return new THREE.BoxGeometry(2.1, 2.1, 2.1); } }
  };
  var objects = [];   // {mesh, glow, label, meta}
  var names = {};     // 'a' -> {node, sprite}
  var refs = [];      // {line, from(){Vector3}, to(){Vector3}}
  var idCounter = 0x3f2a10;

  function createObject(type, value, pos, extra) {
    var m = TYPE_META[type];
    var mesh = new THREE.Mesh(m.geo(), new THREE.MeshStandardMaterial({
      color: new THREE.Color(m.color), emissive: new THREE.Color(m.color).multiplyScalar(0.25),
      metalness: 0.25, roughness: 0.3, flatShading: true
    }));
    mesh.position.copy(pos);
    mesh.scale.setScalar(0.01);
    var glow = glowSprite(m.color, type === "list" ? 7 : 5);
    glow.position.copy(pos);
    glow.material.opacity = 0;
    var label = textSprite(type + "·" + value, "#164e7e", 4.6);
    label.position.set(pos.x, pos.y + 1.9, pos.z);
    label.material.opacity = 0;
    scene.add(mesh, glow, label);
    var obj = {
      mesh: mesh, glow: glow, label: label,
      meta: Object.assign({
        type: type, value: value,
        id: (idCounter += 137).toString(16),
        mutable: type === "list",
        methods: { str: "upper · split · replace · join", int: "bit_length · to_bytes", float: "is_integer · hex", list: "append · pop · sort · extend" }[type]
      }, extra || {})
    };
    objects.push(obj);
    mesh.userData.obj = obj;
    gsap.to(mesh.scale, { x: 1, y: 1, z: 1, duration: 0.8, ease: "back.out(1.6)" });
    gsap.to(glow.material, { opacity: 0.3, duration: 0.9 });
    gsap.to(label.material, { opacity: 1, duration: 0.6, delay: 0.25 });
    gsap.from(label.position, { y: pos.y + 3.2, duration: 0.8, ease: "power3.out" });
    return obj;
  }

  function nameY(i) { return 3.4 - i * 1.55; }
  function bindName(name, obj, idx) {
    if (names[name]) {
      // 已存在名字：换绑或复用
      var nb = names[name];
      gsap.to(nb.sprite.material, { opacity: 1, duration: 0.3 });
      nb.target = obj;
      return nb;
    }
    var pos = new THREE.Vector3(-7.5, nameY(idx), 1.5);
    var node = new THREE.Mesh(
      new THREE.SphereGeometry(0.22, 16, 12),
      new THREE.MeshBasicMaterial({ color: 0x334155 })
    );
    node.position.copy(pos);
    var sprite = textSprite(name, "#0f2a47", 2.2);
    sprite.position.set(pos.x - 1.1, pos.y, pos.z);
    sprite.material.opacity = 0;
    node.scale.setScalar(0.01);
    scene.add(node, sprite);
    gsap.to(node.scale, { x: 1, y: 1, z: 1, duration: 0.5, ease: "back.out(2)" });
    gsap.to(sprite.material, { opacity: 1, duration: 0.5 });
    var nb2 = { node: node, sprite: sprite, target: obj };
    names[name] = nb2;
    addRef(nb2, obj);
    return nb2;
  }

  function addRef(nb, obj) {
    var g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
    var line = new THREE.Line(g, new THREE.LineBasicMaterial({
      color: new THREE.Color(TYPE_META[obj.meta.type].color), transparent: true, opacity: 0.85
    }));
    line.geometry.setDrawRange(0, 0);
    scene.add(line);
    var ref = {
      line: line, nb: nb, obj: obj,
      from: function () { return nb.node.position.clone(); },
      to: function () { return obj.mesh.position.clone(); }
    };
    refs.push(ref);
    var pts = curvePts(ref);
    line.geometry.setFromPoints(pts);
    line.geometry.setDrawRange(0, 0);
    gsap.to(line.geometry.drawRange, { count: 40, duration: 0.7, ease: "power2.inOut" });
    return ref;
  }
  function curvePts(ref) {
    var a = ref.from(), b = ref.to();
    var mid = a.clone().lerp(b, 0.5);
    mid.y += 0.6; mid.z -= 1.4;
    var curve = new THREE.QuadraticBezierCurve3(a, mid, b);
    return curve.getPoints(40);
  }

  /* ---------- 逐步执行脚本 ---------- */
  var strObj, listObj;
  var STEPS = [
    function () { strObj = createObject("str", '"hello"', new THREE.Vector3(3.2, 1.8, 0.5)); bindName("a", strObj, 0); },
    function () { bindName("b", strObj, 1); },
    function () {
      listObj = createObject("list", "[1, 2]", new THREE.Vector3(2.6, -1.6, -2.6));
      bindName("c", listObj, 2);
      var i1 = createObject("int", "1", new THREE.Vector3(6.0, -0.4, -4.6));
      var i2 = createObject("int", "2", new THREE.Vector3(6.6, -2.4, -1.8));
      listObj.elements = [i1, i2];
      setTimeout(function () {
        addRef({ node: { position: listObj.mesh.position.clone().add(new THREE.Vector3(1.1, -0.4, 1.1)) } }, i1);
        addRef({ node: { position: listObj.mesh.position.clone().add(new THREE.Vector3(1.1, 0.5, 1.1)) } }, i2);
      }, 450);
    },
    function () {
      if (listObj.elements) {
        setTimeout(function () {
          addRef({ node: { position: listObj.mesh.position.clone().add(new THREE.Vector3(0.2, 1.3, 1.2)) } }, strObj);
        }, 350);
      }
      gsap.fromTo(listObj.mesh.rotation, { z: 0 }, { z: Math.PI * 0.5, duration: 0.7, ease: "back.inOut(1.4)" });
    },
    function () { bindName("d", createObject("float", "3.14", new THREE.Vector3(4.8, 2.6, -4.2)), 3); },
    function () {
      ["a", "b"].forEach(function (n, i) {
        gsap.fromTo(names[n].sprite.material, { opacity: 0.35 }, { opacity: 1, duration: 0.6, delay: i * 0.35, yoyo: true, repeat: 1 });
      });
      gsap.to(strObj.glow.scale, { x: 7.4, y: 7.4, duration: 0.5, yoyo: true, repeat: 3 });
    },
    function () {
      var e = createObject("str", '"hello"', new THREE.Vector3(0.4, 3.6, -4.6));
      bindName("e", e, 4);
    },
    function () {
      var eNames = Object.keys(names).filter(function (n) { return names[n].target && names[n].target.meta.value === '"hello"'; });
      eNames.forEach(function (n) { gsap.to(names[n].sprite.material, { opacity: 0.5, duration: 0.4 }); });
    }
  ];

  /* ---------- UI ---------- */
  var codeEl = document.getElementById("code");
  CODE.forEach(function (line, i) {
    var s = document.createElement("span");
    s.className = "ln";
    s.textContent = line;
    codeEl.appendChild(s);
  });
  var lines = codeEl.querySelectorAll(".ln");
  var step = -1;
  document.getElementById("bNext").addEventListener("click", function () {
    if (step >= STEPS.length - 1) return;
    step++;
    lines.forEach(function (el, i) {
      el.classList.toggle("cur", i === step);
      el.classList.toggle("done", i < step);
    });
    document.getElementById("note").innerHTML = "<b>" + CODE[step] + "</b><br>" + NOTES[step];
    STEPS[step]();
  });
  document.getElementById("bPrev").addEventListener("click", function () { /* 3D 时间线只进不退，提示重置 */ });
  document.getElementById("bReset").addEventListener("click", function () { location.reload(); });

  /* ---------- 点击拾取 → 身份卡 ---------- */
  var ray = new THREE.Raycaster(); var mouseV = new THREE.Vector2();
  var insEl = document.getElementById("inspector");
  document.getElementById("insClose").addEventListener("click", function () { insEl.style.display = "none"; });
  renderer.domElement.addEventListener("click", function (ev) {
    mouseV.x = (ev.clientX / innerWidth) * 2 - 1;
    mouseV.y = -(ev.clientY / innerHeight) * 2 + 1;
    ray.setFromCamera(mouseV, camera);
    var hits = ray.intersectObjects(objects.map(function (o) { return o.mesh; }));
    if (hits.length) {
      var m = hits[0].object.userData.obj;
      document.getElementById("insBody").innerHTML =
        '<div class="row"><span>type()</span><span>' + m.meta.type + '</span></div>' +
        '<div class="row"><span>id()</span><span>0x' + m.meta.id + '</span></div>' +
        '<div class="row"><span>value</span><span>' + m.meta.value + '</span></div>' +
        '<div class="row"><span>可变?</span><span>' + (m.meta.mutable ? "可变 mutable" : "不可变 immutable") + "</span></div>" +
        '<div class="row"><span>常用方法</span><span>' + m.meta.methods + "</span></div>";
      insEl.style.display = "block";
      gsap.fromTo(insEl, { y: -8, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3 });
      gsap.fromTo(m.mesh.scale, { x: 1.25, y: 1.25, z: 1.25 }, { x: 1, y: 1, z: 1, duration: 0.6, ease: "elastic.out(1,0.4)" });
    }
  });

  /* ---------- 渲染循环 ---------- */
  var t = 0;
  function loop() {
    requestAnimationFrame(loop);
    t += 0.016;
    objects.forEach(function (o, i) {
      o.mesh.rotation.y += 0.006;
      o.mesh.rotation.x += 0.002;
      o.mesh.position.y += Math.sin(t * 1.4 + i * 1.7) * 0.0016;
      o.glow.position.copy(o.mesh.position);
      o.label.position.set(o.mesh.position.x, o.mesh.position.y + 1.9, o.mesh.position.z);
    });
    Object.keys(names).forEach(function (n, i) {
      names[n].node.position.y += Math.sin(t * 1.1 + i) * 0.0012;
      names[n].sprite.position.set(names[n].node.position.x - 1.1, names[n].node.position.y, names[n].node.position.z);
    });
    refs.forEach(function (r) {
      if (r.nb && r.nb.node && r.obj) {
        var pts = curvePts(r);
        var attr = r.line.geometry.getAttribute("position");
        for (var i = 0; i < pts.length; i++) { attr.setXYZ(i, pts[i].x, pts[i].y, pts[i].z); }
        attr.needsUpdate = true;
      }
    });
    updateCam();
    renderer.render(scene, camera);
  }
  loop();
  window.addEventListener("resize", function () {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
})();
</script>
</body>
</html>
